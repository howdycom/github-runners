services:
  github-runner-heavy:
    build:
      context: .
    restart: unless-stopped
    # Give in-flight jobs and the deregistration cleanup time to finish on stop.
    stop_grace_period: 120s
    # Replica counts live here (fed from .env) rather than only in the deploy's
    # --scale flags, so a later bare `docker compose up -d` on the host does not
    # silently collapse each tier to a single runner.
    deploy:
      replicas: ${RUNNER_HEAVY_REPLICAS:-2}
    environment:
      GITHUB_ORG_URL: ${GITHUB_ORG_URL}
      # Deliberately NOT named GITHUB_TOKEN: that name collides with the
      # per-job token GitHub Actions injects, and start.sh unsets this from the
      # environment before starting the listener so jobs cannot read it.
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      RUNNER_LABELS: ${RUNNER_HEAVY_LABELS:-docker,ubuntu-22.04,heavy}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-github-runner}-heavy
      RUNNER_VERSION: ${RUNNER_VERSION:-2.323.0}
    # Host docker group gid so the runner user can use the mounted socket
    # (DOCKER_GID is appended to .env at deploy time).
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  github-runner-light:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 120s
    deploy:
      replicas: ${RUNNER_LIGHT_REPLICAS:-4}
    environment:
      GITHUB_ORG_URL: ${GITHUB_ORG_URL}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      RUNNER_LABELS: ${RUNNER_LIGHT_LABELS:-docker,ubuntu-22.04,light}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-github-runner}-light
      RUNNER_VERSION: ${RUNNER_VERSION:-2.323.0}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
