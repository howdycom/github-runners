services:
  portainer:
    # Pinned deliberately: `latest` silently changes first-run behavior between
    # versions (2.39 added a required X-Setup-Token for admin initialization),
    # which turns an unattended redeploy into a surprise manual step.
    image: portainer/portainer-ce:2.39.5
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
